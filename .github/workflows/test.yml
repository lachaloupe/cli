name: Test

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-tag-sync:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check cligen depends on tagged cli version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu

          expected="github.com/lachaloupe/cli $VERSION"
          if ! grep -Fq "$expected" cmd/cligen/go.mod; then
            echo "expected to find '$expected' in cmd/cligen/go.mod"
            exit 1
          fi

  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            module: .
            goflags: ""
            gowork: ""
          - name: cligen
            module: cmd/cligen
            goflags: -mod=mod
            gowork: off
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      - name: Run tests
        env:
          GOFLAGS: ${{ matrix.goflags }}
          GOWORK: ${{ matrix.gowork }}
          GOTELEMETRY: off
        run: go test ./...
