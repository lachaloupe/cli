name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            module: .
            goflags: ""
            gowork: ""
          - name: cligen
            module: cmd/cligen
            goflags: -mod=mod
            gowork: off
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      - name: Run tests
        env:
          GOFLAGS: ${{ matrix.goflags }}
          GOWORK: ${{ matrix.gowork }}
          GOTELEMETRY: off
        run: go test ./...
